description: Matches a folder of images to EarthRanger events by timestamp and uploads them as file attachments, surfacing matched and unmatched images on an interactive dashboard.

theory: "Images are matched to events by comparing EXIF capture timestamps against each event's time within a configurable window. For ER Mobile events, the window is extended from event_time - window to created_at + window to account for delays between an incident occurring and the event being submitted from the field." # optional

